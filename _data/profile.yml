bio: >-
  Creative design depends on finding problems worth solving that people rarely
  articulate, and on imagining solutions beyond familiar features. My research develops
  <strong class="key">human-centered artificial creativity (AC)</strong>: AI that helps
  designers comprehend and integrate knowledge at scale, from user experiences to
  engineering principles, and translate it into creative possibilities. Bridging AI,
  cognitive psychology, and design, I develop and evaluate AI-native methods for ideation
  and empathic inference within a theory-based framework for artificial creativity, with
  outputs that designers can interpret, assess, and develop further.

# bio_more can hold several paragraphs: separate them with a blank line.
bio_more: |-
  My work expands the design space along two axes: transferring knowledge from distant
  domains to explore solutions, and inferring users' latent needs through artificial
  empathy to explore problems. A theory-based AC framework unifies the two so that
  problems and solutions co-evolve, and I am now extending it toward closed-loop,
  human-AI co-design.

# Figure shown beside the opening paragraph. Replace the image file to update it
