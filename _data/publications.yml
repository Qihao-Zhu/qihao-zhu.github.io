# PUBLICATIONS
#
# Each entry starts with "- type:". Entries appear on the site in
# the order written here within each group, so put the newest first.
#
# type:    journal | conference   (which group it goes in)
# authors: as you want them printed; "Zhu, Q." is bolded automatically
# year:    4-digit year
# title:   paper title
# venue:   journal or conference name
# details: volume(issue), pages, or conference location and dates (optional)
# doi:     just the DOI, e.g. 10.1115/1.4067527 (optional)
# url:     a link if there is no DOI (optional)
# pdf:     path to a PDF in assets/pdf/, e.g. /assets/pdf/zhu2025.pdf (optional)
# award:   e.g. Best Paper Award (optional)
# figure:  path to an image shown below the citation, e.g. /assets/img/pubs/zhu2025.jpg (optional)
# figure_caption: one sentence under that image (optional)
# tags:    [Generative AI, Empathy]  topics, matching the research interests in
#          profile.yml; used for filtering on the Publications page (optional)
# selected: true   to show it on the home page (optional)
#
# Wrap a value in double quotes if it contains a colon (:) or starts
# with a special character.
# =================================================================

